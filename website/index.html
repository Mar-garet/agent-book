<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f7f3" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="description" content="从问题、约束与取舍出发，理解 Agent 的记忆、上下文、工具、协作与可靠执行。" />
    <link rel="canonical" href="https://mar-garet.github.io/agent_book/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Agent Book · Agent 的设计思想" />
    <meta property="og:description" content="一本以设计思想为主线的开源中文书，讲清 Agent 的机制、选择与代价。" />
    <meta property="og:url" content="https://mar-garet.github.io/agent_book/" />
    <meta property="og:image" content="https://mar-garet.github.io/agent_book/assets/agent-design-paths-social.webp" />
    <title>Agent Book · Agent 的设计思想</title>
    <script>
      // Discover the home illustration before the reader bundle, without loading it on chapter routes.
      const route = new URLSearchParams(location.search);
      if (!route.has('read') && (!route.get('page') || route.get('page') === 'home')) {
        const image = document.createElement('link');
        image.rel = 'preload'; image.as = 'image'; image.href = './assets/agent-design-paths.webp';
        image.setAttribute('imagesrcset', './assets/agent-design-paths-640.webp 640w, ./assets/agent-design-paths.webp 1440w');
        image.setAttribute('imagesizes', '(max-width: 767px) calc(100vw - 48px), (max-width: 1348px) 52vw, 640px');
        image.setAttribute('fetchpriority', 'high');
        document.head.append(image);
      }
      try {
        const preference = JSON.parse(localStorage.getItem('agent-book-theme') || '"system"');
        document.documentElement.dataset.theme = preference === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>请开启 JavaScript 使用阅读导航，或下载 <a href="./manuscript/book/README.md">Agent Book 原始目录</a>。</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
